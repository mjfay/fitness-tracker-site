<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Training Dashboard</title>
<style>
  :root {
    color-scheme: light;
    --surface: #fcfcfb; --card: #ffffff; --text: #0b0b0b; --text2: #52514e; --muted: #787772;
    --grid: #e8e7e3; --line: #dddcd7;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948; --gold: #d4a017;
    --good: #0ca30c; --bad: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface: #1a1a19; --card: #222221; --text: #ffffff; --text2: #c3c2b7; --muted: #8f8e86;
      --grid: #2f2f2d; --line: #3a3a37;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --gold: #f2c230;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface: #1a1a19; --card: #222221; --text: #ffffff; --text2: #c3c2b7; --muted: #8f8e86;
    --grid: #2f2f2d; --line: #3a3a37;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --gold: #f2c230;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--surface); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { padding: 0 16px 48px; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 0 8px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; }
  button, select, input { font: inherit; color: var(--text); }
  input, select { font-size: 16px; }   /* 16px+ stops iOS Safari zooming the page on focus */
  select { max-width: 100%; }
  .btn { background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  .btn:hover { border-color: var(--muted); }
  .btn[aria-pressed="true"], .btn.on { background: var(--text); color: var(--surface); border-color: var(--text); }
  nav { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 0 4px; }
  .controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 12px 0 16px; }
  .controls .lbl { color: var(--muted); font-size: 13px; margin-right: 4px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .tile .k { color: var(--muted); font-size: 13px; }
  .tile .v { font-size: 26px; font-weight: 600; line-height: 1.2; margin-top: 2px; }
  .tile .d { font-size: 13px; color: var(--text2); margin-top: 2px; }
  .hero { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .hero .v { font-size: 52px; font-weight: 650; }
  .meter { height: 8px; background: var(--grid); background: color-mix(in srgb, var(--s1) 18%, var(--card)); border-radius: 4px; overflow: hidden; margin-top: 8px; width: 100%; }
  .meter > i { display: block; height: 100%; background: var(--s1); border-radius: 4px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 14px; }
  @media (max-width: 520px) {
    .grid { grid-template-columns: 1fr; }
    body { padding: 0 12px 40px; }
    .btn { min-height: 40px; padding: 8px 14px; }            /* comfortable tap targets */
    .card .top .btn { min-height: 36px; padding: 6px 12px; }
    #lockForm .btn { min-height: 44px; padding: 10px 28px; }
    .tiles { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .tile .v { font-size: 22px; } .hero .v { font-size: 44px; }
    .plot { height: 240px; } .plot.tall { height: 320px; }
    .card { padding: 12px 10px 8px; }
  }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 10px; min-width: 0; }
  .card h2 { font-size: 15px; font-weight: 600; margin: 0; }
  .card .cs { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
  .card .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .card .top .btn { padding: 2px 8px; font-size: 12px; }
  .plot { position: relative; height: 260px; }
  .plot.tall { height: 340px; }
  #view > .card { margin-bottom: 16px; }          /* cards (Workouts, Lift of the day) never touch the block below */
  .tiles { margin-bottom: 16px; } .tiles + .grid, .controls + .grid { margin-top: 0; }
  .wk .hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .wk .nav { display: flex; gap: 6px; align-items: center; }
  .wk .nav .btn { min-width: 40px; }
  .wkstrip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 14px; }
  .daybtn { background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 6px 2px; cursor: pointer; text-align: center; min-width: 0; }
  .daybtn:hover { border-color: var(--muted); }
  .daybtn[aria-pressed="true"] { background: var(--text); color: var(--surface); border-color: var(--text); }
  .daybtn.today:not([aria-pressed="true"]) { border-color: var(--s1); }
  .daybtn .dn { font-size: 12px; opacity: .75; } .daybtn .dd { font-size: 17px; font-weight: 600; line-height: 1.2; }
  .daybtn .dt { font-size: 11px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .daybtn .ds { font-size: 12px; height: 16px; }
  .sess { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-top: 10px; }
  .sess .t { font-size: 17px; font-weight: 600; margin: 0 0 4px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .chip { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; color: var(--text2); display: inline-flex; align-items: center; gap: 5px; }
  .chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px 14px; margin-top: 6px; }
  .kv div span { display: block; color: var(--muted); font-size: 12px; } .kv div b { font-size: 16px; font-weight: 600; }
  .exr { display: flex; justify-content: space-between; gap: 14px; padding: 9px 0; border-top: 1px solid var(--grid); }
  .exr:first-of-type { border-top: 0; } .exr .exs { text-align: right; white-space: nowrap; color: var(--text2); font-variant-numeric: tabular-nums; }
  @media (max-width: 520px) { .exr { flex-wrap: wrap; } .exr .exs { text-align: left; white-space: normal; } }
  .sec { font-size: 17px; font-weight: 600; margin: 28px 0 12px; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; font-size: 14px; }
  .tablewrap { max-height: 260px; overflow: auto; font-size: 13px; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { position: sticky; top: 0; background: var(--card); color: var(--text2); font-weight: 600; }
  #lock { max-width: 360px; margin: 18vh auto 0; text-align: center; }
  #lock input[type=password], #lock input[type=text] { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); margin: 12px 0 8px; }
  #lock label { color: var(--muted); font-size: 13px; display: block; margin-bottom: 12px; }
  #err { color: var(--bad); min-height: 1.4em; font-size: 14px; }
  .hidden { display: none !important; }
  .good { color: var(--good); } .bad { color: var(--bad); }
  .pill { font-size: 11px; padding: 1px 6px; border-radius: 8px; background: var(--s1); color: #fff; vertical-align: 1px; }
</style>
</head>
<body>
<div class="wrap">

<section id="lock">
  <h1>Training Dashboard</h1>
  <p class="sub">Private data, decrypted in your browser. Enter the passphrase.</p>
  <form id="lockForm" autocomplete="off">
    <input id="pass" type="password" placeholder="Passphrase" autocomplete="current-password" aria-label="Passphrase" autofocus>
    <label><input id="remember" type="checkbox"> Remember on this device</label>
    <button class="btn on" type="submit">Unlock</button>
    <div id="err" role="alert"></div>
  </form>
</section>

<main id="app" class="hidden">
  <header>
    <div><h1>Training Dashboard</h1><div class="sub" id="updated"></div></div>
    <div style="display:flex;gap:6px"><button class="btn" id="theme" title="Toggle theme">Theme</button><button class="btn" id="lockBtn">Lock</button></div>
  </header>
  <nav id="tabs" aria-label="Sections"></nav>
  <div class="controls" id="rangeBar"><span class="lbl">Range</span></div>
  <div id="view"></div>
</main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script>
"use strict";
/* ---------- decrypt ---------- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(blob, pass) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(blob.salt), iterations: blob.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(blob.iv) }, key, b64(blob.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
const $ = s => document.querySelector(s);
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
                del: k => { try { localStorage.removeItem(k); } catch {} } };

let D = null, tab = "biking", rangeWeeks = 8, charts = [];

async function unlock(pass, remember) {
  const btn = $("#lockForm button"); btn.disabled = true; btn.textContent = "Unlocking…";
  $("#err").textContent = "";
  try {
    const blob = await (await fetch("data.enc.json?" + Date.now())).json();
    D = await decrypt(blob, pass);
  } catch (e) {
    $("#err").textContent = "Wrong passphrase (or data not published yet).";
    store.del("pp"); btn.disabled = false; btn.textContent = "Unlock";
    return false;
  }
  if (remember) store.set("pp", pass);
  $("#lock").classList.add("hidden"); $("#app").classList.remove("hidden");
  prep(); render();
  return true;
}
$("#lockForm").addEventListener("submit", e => { e.preventDefault(); unlock($("#pass").value, $("#remember").checked); });
$("#lockBtn").addEventListener("click", () => { store.del("pp"); location.reload(); });
$("#theme").addEventListener("click", () => {
  const cur = document.documentElement.dataset.theme;
  const next = cur === "dark" ? "light" : cur === "light" ? "" : "dark";
  if (next) document.documentElement.dataset.theme = next; else delete document.documentElement.dataset.theme;
  store.set("theme", next);
  if (D) render();
});
{ const t = store.get("theme"); if (t) document.documentElement.dataset.theme = t; }
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => D && render());
{ const pp = store.get("pp"); if (pp) unlock(pp, true); }

/* ---------- helpers ---------- */
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const DAY = 864e5;
const ms = iso => Date.parse(iso + "T00:00:00Z");
const isoOf = t => new Date(t).toISOString().slice(0, 10);
/* Chart x positions are LOCAL midnight so they line up with the time axis and tooltips, which format in the viewer's
   timezone. (ms() is UTC midnight: fine for day arithmetic, but it plotted every point at 8 PM the previous day.) */
const cx = iso => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d).getTime(); };
const isoLocal = t => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const weekStart = iso => { const t = ms(iso), dow = (new Date(t).getUTCDay() + 6) % 7; return isoOf(t - dow * DAY); };
const short = iso => new Date(ms(iso)).toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
const sum = a => a.reduce((x, y) => x + y, 0);
const avg = a => a.length ? sum(a) / a.length : null;
const round = (x, d = 0) => x == null ? null : Math.round(x * 10 ** d) / 10 ** d;
const fmtN = (x, d = 0) => x == null ? "–" : x.toLocaleString("en-US", { maximumFractionDigits: d });
const last = a => a[a.length - 1];
const LB_PER_KG = 2.20462;

let LATEST = "";   // newest date with real data; "today" for the purposes of ranges
function prep() {
  D.bike_all = D.bike.slice();   // the plan, including future days; the charts below use only rides that happened
  D.bike = D.bike.filter(r => r.power != null || r.hr.length || r.kj != null);  // drop future planned rows
  const dates = [...D.bike.map(r => r.date), ...D.health.map(h => h.date), ...D.lift_sessions.map(l => l.date), ...D.leetcode.log.map(l => l.date)];
  LATEST = dates.sort().pop() || isoOf(Date.now());
  estimateKj();
  $("#updated").textContent = "Updated " + new Date(D.generated).toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
  if (D.watch_last_sample) {
    const hrs = (Date.now() - Date.parse(D.watch_last_sample)) / 36e5, when = new Date(D.watch_last_sample).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" });
    const el = document.createElement("span"); el.id = "watchSync";
    el.textContent = ` · Watch synced ${when}` + (hrs > 6 ? ` (${Math.round(hrs)} h ago, open the Fitbit app to sync)` : "");
    if (hrs > 6) el.style.color = "var(--bad)";
    $("#updated").appendChild(el);
  }
}
const cutoff = () => rangeWeeks ? isoOf(ms(LATEST) - rangeWeeks * 7 * DAY) : "0000";
const inRange = r => r.date >= cutoff();
const upTo = (arr, n) => arr.slice(-n);

/* weight (lb) known on a date: latest reading on or before it (health tab + bike log) */
function weightOn(iso) {
  const w = [...D.health.filter(h => h.weight != null).map(h => [h.date, h.weight]), ...D.bike.filter(b => b.weight != null).map(b => [b.date, b.weight])].sort();
  let v = null; for (const [d, x] of w) { if (d <= iso) v = x; }
  return v ?? (w[0] && w[0][1]);
}
const ftpTests = () => D.bike.filter(r => /test/i.test(r.type) && (r.ftp_note || r.power)).map(r => {
  const ftp = r.ftp_note || r.power * 0.95, lb = weightOn(r.date);   // ramp test: FTP typed in Notes; 20-min test: 95% of average
  return { date: r.date, ftp, rel: lb ? ftp / (lb / LB_PER_KG) : null };
});
const GOAL = { rel: 3.0, date: "2026-11-26" };   // Thanksgiving

/* ---------- bikes, estimated kJ, estimated calories ---------- */
const BIKES = ["Matrix bike 1", "Matrix bike 2", "Matrix bike ?", "Outside"];   // fixed colour slot per bike
const bikeOf = r => r.bike || "Unlabeled";
const HOLY_GRAIL = "HOLY GRAIL";   // the new trainer: gold everywhere it shows up
const isGrail = b => (b || "").toUpperCase() === HOLY_GRAIL;
const bikeSlot = b => { const i = BIKES.indexOf(b); return i < 0 ? 4 : i; };
const median = a => { const v = a.filter(x => x != null).sort((x, y) => x - y); if (!v.length) return null; const m = v.length >> 1; return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2; };
const restingOn = iso => { const h = D.health.filter(x => x.resting_hr != null && x.date <= iso); return h.length ? last(h).resting_hr : 45; };

/* A ride with no watts gets an ESTIMATED kJ: the median power of your recent rides of the same type, scaled by how
   much harder/easier the heart worked (heart-rate-reserve ratio vs. those rides). Always flagged as an estimate. */
function estimateKj() {
  const withPower = D.bike.filter(r => r.power != null && r.duration);
  D.bike.forEach(r => {
    r.kj_est = false; r.kj_final = r.kj;
    if (r.kj != null || !r.duration) return;
    const type = r.type || "Endurance";
    const refs = withPower.filter(x => (x.type || "Endurance") === type && x.date <= r.date).slice(-6);
    const pool = refs.length ? refs : withPower.filter(x => (x.type || "Endurance") === type).slice(0, 6);
    if (!pool.length) return;
    let w = median(pool.map(x => x.power));
    const rhr = restingOn(r.date), refHr = median(pool.map(x => x.hr_avg));
    if (r.hr_avg != null && refHr != null && refHr > rhr + 10) w *= Math.max(0.5, Math.min(1.4, (r.hr_avg - rhr) / (refHr - rhr)));
    r.kj_final = Math.round(w * r.duration * 60 / 1000); r.kj_est = true;
  });
}

/* Estimated calories per day (not Fitbit's activity estimate). Everything is a stated assumption:
   resting = Mifflin-St Jeor BMR from your height, age, sex and that day's weight (profile lives in the encrypted data)
   bike    = kJ / 0.24 / 4.184 (about 24% gross efficiency), minus the resting burn during the ride so it isn't counted twice
   lifts   = (4.5 METs - 1) x body kg x hours, using the watch's session length (60 min if a day has sets but no length)
   steps   = 0.57 kcal per lb per mile, 2,200 steps per mile
   digestion (thermic effect of food) = 10% of everything above
   Without a profile, resting is omitted and the bike is left gross (active-only view). */
const KCAL = { tef: 0.10, bikePerKj: 1 / 0.24 / 4.184, liftMet: 4.5, walkKcalPerLbMile: 0.57, stepsPerMile: 2200 };
function bmrOn(iso) {
  const p = D.profile, lb = weightOn(iso);
  if (!p || !lb) return null;
  return 10 * lb / LB_PER_KG + 6.25 * p.height_cm - 5 * p.age + p.sex_const;
}
function dailyCalories() {
  const act = new Map(); const get = d => { if (!act.has(d)) act.set(d, { bike: 0, lift: 0, steps: 0, est: false }); return act.get(d); };
  D.bike.forEach(r => {
    if (r.kj_final == null) return;
    const x = get(r.date), bmr = bmrOn(r.date);
    x.bike += Math.max(0, r.kj_final * KCAL.bikePerKj - (bmr ? bmr / 1440 * (r.duration || 0) : 0));
    x.est = x.est || r.kj_est;
  });
  const dur = {}; D.lift_sessions.forEach(l => { if (l.duration != null) dur[l.date] = (dur[l.date] || 0) + l.duration; });
  new Set([...Object.keys(dur), ...D.lift_sets.map(x => x.date)]).forEach(d => {
    const lb = weightOn(d) || 170, mins = dur[d] ?? 60;
    get(d).lift += (KCAL.liftMet - 1) * (lb / LB_PER_KG) * (mins / 60);
  });
  D.health.forEach(h => { if (h.steps != null) get(h.date).steps += KCAL.walkKcalPerLbMile * (weightOn(h.date) || 170) * h.steps / KCAL.stepsPerMile; });
  const first = [...act.keys()].sort()[0] || LATEST, out = [];
  for (let t = ms(first); t <= ms(LATEST); t += DAY) {
    const d = isoOf(t), x = act.get(d) || { bike: 0, lift: 0, steps: 0, est: false }, rest = bmrOn(d);
    const base = (rest || 0) + x.bike + x.lift + x.steps, tef = rest == null ? null : KCAL.tef * base;
    out.push({ date: d, rest: rest == null ? null : Math.round(rest), bike: Math.round(x.bike), lift: Math.round(x.lift), steps: Math.round(x.steps), tef: tef == null ? null : Math.round(tef), est: x.est,
      total: Math.round(base + (tef || 0)) });
  }
  return out;
}
function calChart(id, o = {}) {
  const rows = dailyCalories().filter(inRange), withRest = !!D.profile && o.rest;
  const ds = [bars("Bike", rows.map(r => r.bike), 0), bars("Lifting", rows.map(r => r.lift), 1), bars("Steps", rows.map(r => r.steps), 2)];
  if (withRest) { ds.unshift(bars("Resting", rows.map(r => r.rest), 0, { color: css("--line") })); ds.push(bars("Digestion (TEF)", rows.map(r => r.tef), 3)); }
  draw(id, { type: "bar", data: { labels: rows.map(r => short(r.date)), datasets: ds },
    options: baseOpts(true, { scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true, title: { display: true, text: "kcal", color: css("--muted") } } },
      plugins: { tooltip: { callbacks: { footer: items => { const r = rows[items[0].dataIndex]; const t = withRest ? r.total : r.bike + r.lift + r.steps;
        return "Total " + fmtN(t) + " kcal" + (r.est ? " (bike kJ partly estimated)" : "") + (r.date === LATEST ? " · day in progress" : ""); } } } } }) });
}
const CAL_NOTE = "Resting (Mifflin-St Jeor) + bike (kJ) + lifting (4.5 METs) + steps (0.57 kcal/lb/mile) + digestion (10%); activity counted above resting";
const CAL_NOTE_ACTIVE = "Active calories only: bike (kJ), lifting (4.5 METs) and steps (0.57 kcal/lb/mile)";

/* ---------- chart plumbing ---------- */
const SERIES = ["--s1", "--s2", "--s3", "--s4", "--s5", "--s6", "--s7", "--s8"];
const sc = i => css(SERIES[i]);
function deepMerge(a, b) {
  for (const k in b) a[k] = (b[k] && typeof b[k] === "object" && !Array.isArray(b[k]) && a[k]) ? deepMerge(a[k], b[k]) : b[k];
  return a;
}
function baseOpts(multi, extra = {}) {
  const text2 = css("--text2"), muted = css("--muted"), grid = css("--grid"), card = css("--card"), text = css("--text");
  return deepMerge({
    responsive: true, maintainAspectRatio: false, animation: false,
    interaction: { mode: "index", intersect: false },

/* ---------- workouts: today, with day-by-day navigation ---------- */
const localIso = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

function bikeTiles() {

  const startRel = tests.length ? tests[0].rel : 2.5;

  return `<div class="tiles">
    <div class="tile hero"><div><div class="k">Relative FTP</div><div class="v">${curRel ? curRel.toFixed(2) : "–"} <span class="sub">W/kg</span></div></div>

  draw("r_hrv", { type: "line", data: { datasets: [line("HRV", pts(h, x => x.hrv), 0, { width: 1, extra: { pointRadius: 3 } }), line("7-day average", roll, 1, { noDots: true })] }, options: baseOpts(true, { scales: { x: timeX(), y: yt("ms") } }) });
  const s = h.filter(x => x.sleep_hrs != null), lab = s.map(x => short(x.date));
  draw("r_sleep", { type: "bar", data: { labels: lab, datasets: [["Deep", "deep"], ["REM", "rem"], ["Light", "light"], ["Awake", "awake"]].map(([n, k], i) => bars(n, s.map(x => round((x[k] || 0) / 60, 2)), i)) },
    options: baseOpts(true, { scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true, title: { display: true, text: "hours", color: css("--muted") } } } }) });
  draw("r_weight", { type: "line", data: { datasets: [line("Weight", [...pts(h, x => x.weight), ...pts(D.bike.filter(inRange), x => x.weight)].sort((a, b) => a.x - b.x).filter((p, i, a) => !i || p.x !== a[i - 1].x), 0)] }, options: baseOpts(false, { scales: { x: timeX(), y: yt("lb") } }) });
  const st = h.filter(x => x.steps != null);
  draw("r_steps", { type: "bar", data: { labels: st.map(x => short(x.date)), datasets: [bars("Steps", st.map(x => x.steps), 0)] }, options: baseOpts(false, { scales: { y: { beginAtZero: true } } }) });
  draw("r_resp", { type: "line", data: { datasets: [line("Respiratory rate", pts(h, x => x.resp), 0)] }, options: baseOpts(false, { scales: { x: timeX(), y: yt("breaths/min") } }) });
  draw("r_spo2", { type: "line", data: { datasets: [line("SpO2", pts(h, x => x.spo2), 0)] }, options: baseOpts(false, { scales: { x: timeX(), y: { ...yt("%"), suggestedMin: 90, suggestedMax: 100 } } }) });
}


/* ---------- the lift of the day: the program for the selected date ---------- */
let liftDay = null;
const isPull = e => /chin|pull-?up/i.test(e);
const planOn = iso => (D.lift_plan || []).filter(g => g.date === iso);
const liftLogged = g => g.rows.some(r => String(r.r).trim() !== "" || String(r.w).trim() !== "");
function liftStatus(iso, today) {
  const gs = planOn(iso);
  if (!gs.length) return { icon: "", label: "Rest", short: "Rest" };
  const done = gs.some(liftLogged) || D.lift_sessions.some(s => s.date === iso);
  return { icon: done ? "✓" : iso < today ? "–" : "○", label: done ? "Done" : iso < today ? "Not logged" : "Planned", short: gs[0].day.replace("Day ", "D") };
}
function exerciseBlocks(g) {
  const out = [];
  g.rows.forEach(r => { const k = r.b + "|" + r.e; let x = out.find(o => o.k === k); if (!x) out.push(x = { k, b: r.b, e: r.e, n: r.n, sets: [] }); x.sets.push(r); });
  return out;
}
function setsText(sets) {
  const ts = sets.map(s => s.t), same = ts.every(t => t === ts[0]), unit = sets[0].u, load = sets[0].l;
  const t = same ? (sets.length > 1 ? `${sets.length} × ${ts[0]}` : `${ts[0]}`) : ts.join(" → ");
  return t + (unit ? " " + unit : "") + (load ? " · " + load : "");
}
function liftExerciseHtml(x) {
  const logged = x.sets.filter(s => String(s.r).trim() !== "" || String(s.w).trim() !== "");
  const lg = logged.length ? `<div class="cs" style="margin:2px 0 0">Logged: ${logged.map(s => `${String(s.w).trim() || "–"} × ${String(s.r).trim() || "–"}`).join(", ")}</div>` : "";
  const note = x.n ? `<div class="cs" style="margin:2px 0 0">${x.n}</div>` : "";
  return `<div class="exr"><div><b>${x.b ? x.b + " · " : ""}${x.e}</b>${isPull(x.e) ? ' <span class="chip">Pull-up</span>' : ""}${note}${lg}</div><div class="exs">${setsText(x.sets)}</div></div>`;
}
function pullSession(g) {
  const names = g.rows.map(r => r.e).join("|");
  return /Descending Ladder/i.test(names) ? "Pull-ups · Session 1: descending ladder" : /Max Set/i.test(names) ? "Pull-ups · Session 2: overreach + EMOM" : isPull(names) ? "Includes pull-ups" : "";
}
function liftDayCard() { return '<section class="card wk" id="lwk"></section>'; }
function renderLiftDay() {
  const box = $("#lwk"); if (!box) return;
  const today = localIso(); liftDay = liftDay || today;
  const ws = weekStart(liftDay), days = Array.from({ length: 7 }, (_, i) => addDays(ws, i)), gs = planOn(liftDay);
  const strip = days.map(d => {
    const st = liftStatus(d, today), dn = new Date(ms(d)).toLocaleDateString("en-US", { weekday: "short", timeZone: "UTC" });
    return `<button class="daybtn ${d === today ? "today" : ""}" data-lday="${d}" aria-pressed="${d === liftDay}" aria-label="${longDay(d)}, ${st.short}, ${st.label}">
      <div class="dn">${dn}</div><div class="dd">${+d.slice(8)}</div><div class="dt">${st.short}</div><div class="ds">${st.icon}</div></button>`;
  }).join("");
  const sessions = gs.map(g => {
    const ps = pullSession(g);
    return `<div class="sess"><div class="chips"><span class="chip">Week ${g.week}</span><span class="chip">${g.day}</span>${ps ? `<span class="chip">${ps}</span>` : ""}</div>${exerciseBlocks(g).map(liftExerciseHtml).join("")}</div>`;
  }).join("");
  box.innerHTML = `<div class="hd"><div><h2>Lift of the day</h2><p class="cs" style="margin:0">${longDay(liftDay)} · ${relative(liftDay, today)}</p></div>
      <div class="nav"><button class="btn" data-lstep="-1" aria-label="Previous day">‹</button><button class="btn" data-lstep="0">Today</button><button class="btn" data-lstep="1" aria-label="Next day">›</button></div></div>
    <div class="wkstrip">${strip}</div>
    ${sessions || '<div class="sess"><p class="t" style="margin:0">Rest day</p><p class="cs" style="margin:4px 0 0">No lift scheduled.</p></div>'}`;
}
document.addEventListener("click", e => {
  const day = e.target.closest("[data-lday]"), step = e.target.closest("[data-lstep]");
  if (day) { liftDay = day.dataset.lday; renderLiftDay(); }
  else if (step && step.closest("#lwk")) { const n = +step.dataset.lstep; liftDay = n === 0 ? localIso() : addDays(liftDay || localIso(), n); renderLiftDay(); }
});
document.addEventListener("keydown", e => {
  if (!$("#lwk") || /input|select|textarea/i.test(e.target.tagName)) return;
  if (e.key === "ArrowLeft") { liftDay = addDays(liftDay || localIso(), -1); renderLiftDay(); }
  if (e.key === "ArrowRight") { liftDay = addDays(liftDay || localIso(), 1); renderLiftDay(); }
});

/* --- lifts --- */
const e1rm = (w, r) => r > 12 ? null : w * (1 + r / 30);   // Epley
function liftNames() {
  const c = {}; D.lift_sets.forEach(s => c[s.exercise] = (c[s.exercise] || 0) + 1);
  return Object.entries(c).sort((a, b) => b[1] - a[1]).map(x => x[0]);
}
let liftPick = null;
function lifts() {
  const names = liftNames();
  if (!liftPick || !names.includes(liftPick)) liftPick = ["squat", "pull", "dip"].map(k => names.find(n => n.toLowerCase().includes(k))).find(Boolean) || names[0];
  const ls = D.lift_sessions.filter(inRange), done = new Set(D.lift_sets.filter(inRange).map(x => x.date));
  const tiles = `<div class="tiles">${tile("Sessions", Math.max(ls.length, done.size), "in this range")}
    ${tile("Avg length", ls.length ? fmtN(avg(ls.map(x => x.duration).filter(v => v != null)), 0) + " min" : "–", "")}
    ${tile("Avg heart rate", ls.length ? fmtN(avg(ls.map(x => x.hr).filter(v => v != null)), 0) + " bpm" : "–", "")}
    ${tile("Pull-up max", D.settings && D.settings.pullup_max != null ? D.settings.pullup_max + " reps" : "–", "best bodyweight set (override in sheet cell T3)")}</div>`;
  return liftDayCard() + tiles + `<div class="controls"><span class="lbl">Exercise</span><select id="liftSel" class="btn" aria-label="Exercise">${names.map(n => `<option ${n === liftPick ? "selected" : ""}>${n}</option>`).join("")}</select></div>
  <div class="grid">${card("l_pu", "Pull-up progress", "Best bodyweight set per session (reps)")}${card("l_1rm", "Estimated 1-rep max", "Best set per day, Epley formula (weight × (1 + reps/30))")}${card("l_vol", "Session volume", "Total weight × reps per day, all exercises")}
    ${card("l_dur", "Lifting session length", "Minutes, from your watch")}${card("l_hr", "Lifting heart rate", "Average bpm per session")}</div>`;
}
function liftCharts() {
  renderLiftDay();
  const pu = {}; (D.lift_plan || []).filter(g => inRange(g)).forEach(g => g.rows.forEach(r => {
    const reps = parseFloat(r.r);
    if (isPull(r.e) && /^bw$/i.test(String(r.w).trim()) && !isNaN(reps) && (!pu[g.date] || reps > pu[g.date])) pu[g.date] = reps;
  }));
  draw("l_pu", { type: "line", data: { datasets: [line("Best bodyweight set", Object.entries(pu).sort().map(([d, v]) => ({ x: cx(d), y: v })), 0)] },
    options: baseOpts(false, { scales: { x: timeX(), y: { beginAtZero: true, ticks: { precision: 0 }, title: { display: true, text: "reps", color: css("--muted") } } } }) });
  $("#liftSel") && ($("#liftSel").onchange = e => { liftPick = e.target.value; render(); });
  const s = D.lift_sets.filter(inRange), yt = t => ({ title: { display: true, text: t, color: css("--muted") } });
  const best = {}; s.filter(x => x.exercise === liftPick).forEach(x => { const v = e1rm(x.weight, x.reps); if (v != null && (!best[x.date] || v > best[x.date])) best[x.date] = v; });
  draw("l_1rm", { type: "line", data: { datasets: [line(liftPick || "Est. 1RM", Object.entries(best).sort().map(([d, v]) => ({ x: cx(d), y: round(v, 1) })), 0)] }, options: baseOpts(false, { scales: { x: timeX(), y: yt("lb") } }) });
  const vol = {}; s.forEach(x => vol[x.date] = (vol[x.date] || 0) + x.weight * x.reps);
  const vd = Object.keys(vol).sort();
  draw("l_vol", { type: "bar", data: { labels: vd.map(short), datasets: [bars("Volume (lb)", vd.map(d => Math.round(vol[d])), 1)] }, options: baseOpts(false, { scales: { y: { beginAtZero: true } } }) });
  const ls = D.lift_sessions.filter(inRange);
  draw("l_dur", { type: "bar", data: { labels: ls.filter(x => x.duration != null).map(x => short(x.date)), datasets: [bars("Minutes", ls.filter(x => x.duration != null).map(x => x.duration), 2)] }, options: baseOpts(false, { scales: { y: { beginAtZero: true } } }) });
  draw("l_hr", { type: "line", data: { datasets: [line("Avg HR", pts(ls, x => x.hr), 0)] }, options: baseOpts(false, { scales: { x: timeX(), y: yt("bpm") } }) });
}


/* ---------- contests ---------- */
function contestWeekCount() {
  const ws = weekStart(localIso()), we = addDays(ws, 6);
  return D.contests.log.filter(x => x.date >= ws && x.date <= we).length;
}
function ratingTile(platform) {
  const c = D.contests, t = c.targets[platform] || {}, cur = t.current, hasHandle = platform === "Codeforces" ? !!c.settings.cf_handle : !!c.settings.lc_user;
  const goal = t.ready ? `Goal ${fmtN(t.ready)}${t.date ? " by " + new Date(cx(t.date)).toLocaleDateString("en-US", { month: "short", day: "numeric" }) : ""}` : "";
  const gap = cur != null && t.ready ? `${fmtN(Math.max(0, t.ready - cur))} to go` + (t.per_contest ? ` (~${fmtN(t.per_contest)}/contest)` : "") : (hasHandle ? "no rated contest yet" : `add your ${platform === "Codeforces" ? "handle" : "username"} in the sheet (Contests tab, R${platform === "Codeforces" ? 3 : 2})`);
  return tile(platform + " rating", cur != null ? fmtN(cur) : "–", [goal, gap].filter(Boolean).join(" · "));
}
function contestHtml() {
  const c = D.contests, live = c.log.filter(x => x.mode !== "Virtual").length, virt = c.log.length - live, n = contestWeekCount(), goal = c.settings.goal || 1;
  const recent = [...c.log].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 10);
  const upcoming = c.upcoming.length ? c.upcoming.map(u => `<div class="exr"><div><b>${u.contest}</b>${u.pick ? ' <span class="chip">★ Pick for the week</span>' : ""}</div><div class="exs">${u.starts} · ${u.length}</div></div>`).join("") : '<p class="cs">No upcoming Codeforces contests loaded yet.</p>';
  return `<h2 class="sec" style="margin-top:0">Contests</h2><div class="tiles">
    ${ratingTile("Codeforces")}${ratingTile("LeetCode")}
    ${tile("Contests this week", `${n} / ${goal}`, n >= goal ? "goal met" : "goal: " + goal + " per week (a virtual counts)")}
    ${tile("Contests logged", c.log.length, `${live} live · ${virt} virtual`)}</div>
  <div class="grid">${card("k_rating", "Contest rating vs. goal", "Rating after each rated contest; the dashed line is your interview-ready target")}
    <section class="card"><h2>Upcoming Codeforces rounds</h2><p class="cs">Times in Eastern; one ★ pick per week (Div. 3/4 first, then Educational, then Div. 2)</p>${upcoming}</section></div>
  <section class="card" style="margin-top:14px"><h2>Contest log</h2><div class="tablewrap" style="max-height:none"><table><thead><tr><th>Date</th><th style="text-align:left">Platform</th><th style="text-align:left">Contest</th><th style="text-align:left">Mode</th><th>Solved</th><th>Rank</th><th>Rating</th></tr></thead><tbody>
  ${recent.map(x => `<tr><td>${short(x.date)}</td><td style="text-align:left">${x.platform}</td><td style="text-align:left">${x.contest}</td><td style="text-align:left">${x.mode}${x.rated ? "" : " · unrated"}</td>
    <td>${x.solved != null ? x.solved + (x.problems != null ? "/" + x.problems : "") + (x.after ? ` (+${x.after} after)` : "") : ""}</td><td>${x.rank != null ? fmtN(x.rank) : ""}</td>
    <td>${x.rating != null ? fmtN(x.rating) + (x.change != null ? ` (${x.change >= 0 ? "+" : ""}${x.change})` : "") : ""}</td></tr>`).join("") || '<tr><td colspan="7">No contests logged yet.</td></tr>'}</tbody></table></div></section>
  <h2 class="sec">Practice</h2>`;
}
function contestCharts() {
  const c = D.contests, rated = c.log.filter(x => x.rating != null);
  const ds = ["Codeforces", "LeetCode"].map((p, i) => line(p, rated.filter(x => x.platform === p).map(x => ({ x: cx(x.date), y: x.rating })), i)).filter(d => d.data.length);
  const t0 = rated.length ? cx(rated[0].date) : null;
  ["Codeforces", "LeetCode"].forEach((p, i) => {
    const t = c.targets[p];
    if (t && t.ready && ds.some(d => d.label === p) && t0) ds.push(line(p + " goal", [{ x: t0, y: t.ready }, { x: Math.max(t0 + 7 * DAY, t.date ? cx(t.date) : t0 + 90 * DAY), y: t.ready }], i, { noDots: true, width: 1, extra: { borderDash: [6, 4] } }));
  });
  draw("k_rating", { type: "line", data: { datasets: ds }, options: baseOpts(true, { scales: { x: timeX(), y: { title: { display: true, text: "rating", color: css("--muted") }, ticks: { callback: v => v } } } }) });
}
function career() { return contestHtml() + practiceHtml(); }
function careerCharts() { contestCharts(); practiceCharts(); }

/* --- career --- */
function streak(dates) {
  const set = new Set(dates); let n = 0, t = ms(LATEST);
  if (!set.has(isoOf(t))) t -= DAY;         // today not solved yet doesn't break the streak
  while (set.has(isoOf(t))) { n++; t -= DAY; }
  return n;
}
function practiceHtml() {
  const lc = D.leetcode, log = lc.log, solved = new Set(log.map(x => x.lc)).size;
  const first = log.filter(x => /first/i.test(x.result)).length;
  const vids = log.filter(x => x.video).length, ar = avg(log.map(x => x.rating).filter(Boolean));
  const recent = [...log].sort((a, b) => b.date.localeCompare(a.date) || b.lc - a.lc).slice(0, 12);
  return `<div class="tiles">
    ${tile("Solved", solved, `of ${lc.queue.length} in the queue`)}
    ${tile("Streak", (n => n + (n === 1 ? " day" : " days"))(streak(log.map(x => x.date))), "")}
    ${tile("First-try rate", log.length ? Math.round(first / log.length * 100) + "%" : "–", `${first} of ${log.length}`)}
    ${tile("Avg problem rating", ar ? Math.round(ar) : "–", "")}
    ${tile("Videos posted", vids, "")}</div>
  <div class="grid">${card("c_cum", "Problems solved", "Cumulative, by day")}${card("c_res", "How each solve went", "Per week")}
    ${card("c_pat", "Pattern coverage", "Solved vs. remaining in the queue, by pattern", { tall: true })}${card("c_rate", "Difficulty over time", "Problem rating of each solve")}</div>
  <section class="card" style="margin-top:14px"><h2>Recent solves</h2><div class="tablewrap" style="max-height:none"><table><thead><tr><th>Date</th><th>#</th><th style="text-align:left">Problem</th><th style="text-align:left">Pattern</th><th>Rating</th><th style="text-align:left">Result</th></tr></thead><tbody>
  ${recent.map(x => `<tr><td>${short(x.date)}</td><td>${x.lc}</td><td style="text-align:left">${x.link ? `<a href="${x.link}" target="_blank" rel="noopener" style="color:var(--s1)">${x.name || "Video"} ▶</a>` : (x.name || "")}${x.contest_q ? ` <span class="pill">${x.contest_q}</span>` : ""}</td><td style="text-align:left">${x.pattern || ""}</td><td>${x.rating ?? ""}</td><td style="text-align:left">${x.result}</td></tr>`).join("") || '<tr><td colspan="6">No solves logged yet.</td></tr>'}</tbody></table></div></section>`;
}
function practiceCharts() {
  const log = [...D.leetcode.log].sort((a, b) => a.date.localeCompare(b.date)), seen = new Set(), cum = [];
  log.forEach(x => { seen.add(x.lc); cum.push({ x: cx(x.date), y: seen.size }); });
  const byDay = new Map(); cum.forEach(p => byDay.set(p.x, p.y));
  draw("c_cum", { type: "line", data: { datasets: [line("Solved", [...byDay].map(([x, y]) => ({ x, y })), 0)] }, options: baseOpts(false, { scales: { x: timeX(), y: { beginAtZero: true, ticks: { precision: 0 } } } }) });
  const r = log.filter(inRange), weeks = [...new Set(r.map(x => weekStart(x.date)))].sort();
  const res = [["First try", /first/i], ["With hints", /hint/i], ["Checked solution", /check/i]];
  draw("c_res", { type: "bar", data: { labels: weeks.map(short), datasets: res.map(([n, re], i) => bars(n, weeks.map(w => r.filter(x => weekStart(x.date) === w && re.test(x.result)).length), i)) },
    options: baseOpts(true, { scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true, ticks: { precision: 0 } } } }) });
  const solvedSet = new Set(log.map(x => x.lc)), pats = {};
  D.leetcode.queue.forEach(q => { const p = q.pattern || "Other"; pats[p] = pats[p] || { d: 0, t: 0 }; pats[p].t++; if (q.done || solvedSet.has(q.lc)) pats[p].d++; });
  const names = Object.keys(pats).sort((a, b) => pats[b].t - pats[a].t);
  draw("c_pat", { type: "bar", data: { labels: names, datasets: [bars("Solved", names.map(n => pats[n].d), 0), bars("Remaining", names.map(n => pats[n].t - pats[n].d), 0, { color: css("--grid") })] },
    options: baseOpts(true, { indexAxis: "y", scales: { x: { stacked: true, beginAtZero: true, ticks: { precision: 0 } }, y: { stacked: true, grid: { display: false }, ticks: { autoSkip: false } } } }) });
  draw("c_rate", { type: "line", data: { datasets: [line("Problem rating", pts(log, x => x.rating), 1, { extra: { showLine: false } })] }, options: baseOpts(false, { scales: { x: timeX(), y: { title: { display: true, text: "rating", color: css("--muted") }, ticks: { callback: v => v } } } }) });
}
</script>
